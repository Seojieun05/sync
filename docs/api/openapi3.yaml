components:
  schemas:
    CreateContestOccurrenceRequest:
      title: CreateContestOccurrenceRequest
      required:
      - title
      type: object
      properties:
        description:
          type: string
          description: Contest Occurrence Description
          nullable: true
        title:
          type: string
          description: Contest Occurrence Title
    CreateLikeResponse:
      title: CreateLikeResponse
      required:
      - likeCount
      - liked
      type: object
      properties:
        likeCount:
          type: number
          description: Like count
        liked:
          type: boolean
          description: Liked flag
    CreateJobPostingResponse:
      title: CreateJobPostingResponse
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: Job Posting ID
    GetProvidersResponse:
      title: GetProvidersResponse
      type: object
      properties:
        providers:
          required:
          - nodes
          - pageInfo
          type: object
          properties:
            nodes:
              type: array
              description: Nodes
              items:
                required:
                - content
                - cursor
                type: object
                properties:
                  cursor:
                    type: string
                    description: Node Cursor
                  content:
                    required:
                    - id
                    - isMaintainer
                    - isVerified
                    - name
                    - type
                    type: object
                    properties:
                      isMaintainer:
                        type: boolean
                        description: Maintainer Status
                      isVerified:
                        type: boolean
                        description: Verification Status
                      name:
                        type: string
                        description: Provider Name
                      id:
                        type: string
                        description: Provider ID
                      type:
                        type: string
                        description: Provider Type
                    description: Node Content
            pageInfo:
              required:
              - hasNextPage
              - hasPreviousPage
              - size
              type: object
              properties:
                size:
                  type: number
                  description: Page Size
                hasNextPage:
                  type: boolean
                  description: Has Next Page
                hasPreviousPage:
                  type: boolean
                  description: Has Previous Page
                endCursor:
                  type: string
                  description: End Cursor
                  nullable: true
                startCursor:
                  type: string
                  description: Start Cursor
                  nullable: true
              description: Page Info
    UploadMediaResponse:
      title: UploadMediaResponse
      required:
      - expiresAt
      - mediaId
      - uploadUrl
      type: object
      properties:
        uploadUrl:
          type: string
          description: Pre-signed Upload URL
        mediaId:
          type: string
          description: Media ID
        expiresAt:
          type: string
          description: Expiration Time
    LoginRequest:
      title: LoginRequest
      required:
      - email
      - password
      type: object
      properties:
        password:
          type: string
          description: Password
        email:
          type: string
          description: Email
    GetBookmarkedReflectionsResponse:
      title: GetBookmarkedReflectionsResponse
      type: object
      properties:
        posts:
          required:
          - nodes
          - pageInfo
          type: object
          properties:
            nodes:
              type: array
              description: Nodes
              items:
                required:
                - content
                - cursor
                type: object
                properties:
                  cursor:
                    type: string
                    description: Node Cursor
                  content:
                    required:
                    - bookmarked
                    - bookmarkedAt
                    - commentCount
                    - content
                    - createdAt
                    - id
                    - likeCount
                    - slug
                    type: object
                    properties:
                      createdAt:
                        type: string
                        description: Created At
                      author:
                        required:
                        - handle
                        - id
                        - name
                        type: object
                        properties:
                          name:
                            type: string
                            description: Author Name
                          handle:
                            type: string
                            description: Author Handle
                          id:
                            type: number
                            description: Author ID
                          profileImageUrl:
                            type: string
                            description: Author Profile Image URL
                            nullable: true
                      bookmarked:
                        type: boolean
                        description: Whether the current user bookmarked this reflection
                      likeCount:
                        type: number
                        description: Like Count
                      id:
                        type: number
                        description: Reflection ID
                      bookmarkedAt:
                        type: string
                        description: Bookmarked At
                      content:
                        type: string
                        description: Content
                      slug:
                        type: string
                        description: Reflection Slug
                      commentCount:
                        type: number
                        description: Comment Count
                    description: Node Content
            pageInfo:
              required:
              - hasNextPage
              - hasPreviousPage
              - size
              type: object
              properties:
                size:
                  type: number
                  description: Page Size
                hasNextPage:
                  type: boolean
                  description: Has Next Page
                hasPreviousPage:
                  type: boolean
                  description: Has Previous Page
                endCursor:
                  type: string
                  description: End Cursor
                  nullable: true
                startCursor:
                  type: string
                  description: Start Cursor
                  nullable: true
              description: Page Info
    UploadJobApplicationFileRequest:
      title: UploadJobApplicationFileRequest
      required:
      - fileId
      type: object
      properties:
        fileId:
          type: number
          description: File ID
    GetProjectHandleAvailabilityResponse:
      title: GetProjectHandleAvailabilityResponse
      required:
      - available
      type: object
      properties:
        available:
          type: boolean
          description: 핸들 사용 가능 여부
    CreateJobApplicationResponse:
      title: CreateJobApplicationResponse
      required:
      - applicationId
      type: object
      properties:
        applicationId:
          type: number
          description: Job Application ID
    CreateLikeRequest:
      title: CreateLikeRequest
      required:
      - targetId
      - targetType
      type: object
      properties:
        targetId:
          type: number
          description: Like target ID
        targetType:
          type: string
          description: Like target type
    GetHandleAvailabilityResponse:
      title: GetHandleAvailabilityResponse
      required:
      - available
      type: object
      properties:
        available:
          type: boolean
          description: 핸들 사용 가능 여부
    CreateProjectPostRequest:
      title: CreateProjectPostRequest
      required:
      - content
      - type
      type: object
      properties:
        projectTags:
          type: array
          description: 프로젝트 태그 목록
          nullable: true
          items:
            oneOf:
            - type: object
            - type: boolean
            - type: string
            - type: number
        type:
          type: string
          description: Post Type
          enum:
